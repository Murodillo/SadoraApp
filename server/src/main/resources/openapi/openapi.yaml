          type: boolean
          description: "Qayd etilgan kunlar to'ldirilgan, bashoratlar konturli chiziladi"
        flow: { $ref: "#/components/schemas/FlowLevel" }
        hasNote: { type: boolean }
        symptomCount: { type: integer }

    CycleCalendar:
      type: object
      properties:
