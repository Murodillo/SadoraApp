        meals:
          type: array
          items: { $ref: "#/components/schemas/Meal" }
        totals:
          type: object
          description: "Qayd etilgan ovqatlardan yig'iladi, alohida hisoblagichda saqlanmaydi"
          properties:
            kcal: { type: integer }
            proteinG: { type: integer }
            fatG: { type: integer }
            carbsG: { type: integer }
        goals: { $ref: "#/components/schemas/NutritionGoals" }
        waterMl: { type: integer }

    WaterState:
      type: object
      properties:
        date: { type: string, format: date }
        waterMl: { type: integer }
        waterGoalMl: { type: integer }

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    ScheduleKind:
      type: string
      enum: [daily, weekdays, interval]
    FoodRelation:
      type: string
      enum: [any, before, with, after]
    DoseStatus:
      type: string
      enum: [pending, taken, skipped]

    MedicationSchedule:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/ScheduleKind" }
        times:
          type: array
          description: "Kundagi har bir qabul vaqti — kuniga ikki marta bitta dori, ikkita emas"
          items: { type: string, example: "08:00" }
        weekdays:
          type: array
          items: { $ref: "#/components/schemas/Weekday" }
        intervalDays: { type: integer, nullable: true, minimum: 1, maximum: 90 }

    Medication:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        emoji: { type: string, nullable: true }
        dosage: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        foodRelation: { $ref: "#/components/schemas/FoodRelation" }
        note: { type: string, nullable: true }
        schedule: { $ref: "#/components/schemas/MedicationSchedule" }
        remindersEnabled: { type: boolean }
        startedOn: { type: string, format: date }
        endedOn: { type: string, format: date, nullable: true }
        stockUnits: { type: integer, nullable: true }
        stockDaysLeft:
          type: integer
          nullable: true
          description: "Zaxira va jadvaldan hisoblanadi; zaxira kuzatilmasa — null"
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    SaveMedicationRequest:
      type: object
      required: [name, schedule]
      properties:
        name: { type: string, maxLength: 120 }
        emoji: { type: string, nullable: true }
        dosage: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        foodRelation: { $ref: "#/components/schemas/FoodRelation" }
        note: { type: string, nullable: true }
        schedule: { $ref: "#/components/schemas/MedicationSchedule" }
        remindersEnabled: { type: boolean, default: true }
        startedOn: { type: string, format: date, nullable: true }
        endedOn: { type: string, format: date, nullable: true }
        stockUnits: { type: integer, nullable: true }

    MedicationDose:
      type: object
      properties:
        medicationId: { type: string, format: uuid }
        name: { type: string }
        emoji: { type: string, nullable: true }
        dosage: { type: string, nullable: true }
        foodRelation: { $ref: "#/components/schemas/FoodRelation" }
        dueOn: { type: string, format: date }
        dueAt: { type: string, example: "08:00" }
        status: { $ref: "#/components/schemas/DoseStatus" }
        takenAt: { type: string, format: date-time, nullable: true }
        isLate:
          type: boolean
          description: "Muddatidan bir soat kechroq belgilangan — faqat tarix uchun fakt"

    MedicationDay:
      type: object
      description: "Sanoqlar yuborilmaydi — mijoz `doses` ro'yxatidan o'zi hisoblaydi"
      properties:
        date: { type: string, format: date }
        doses:
          type: array
          items: { $ref: "#/components/schemas/MedicationDose" }

    MedicationHistory:
      type: object
      properties:
        medicationId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/MedicationDay" }
        takenCount: { type: integer }
        skippedCount: { type: integer }
        pendingCount: { type: integer }

    NotificationCategory:
      type: string
      enum: [med_reminder, cycle, daily_check_in, water, insight, system]
    NotificationStatus:
      type: string
      enum: [queued, sent, failed, suppressed]

    NotificationSettings:
      type: object
      properties:
        enabled: { type: boolean }
        categories:
          type: object
          description: "Ko'rsatilmagan kategoriya — yoqilgan"
          additionalProperties: { type: boolean }
        quietFrom: { type: string, nullable: true, example: "22:00" }
        quietUntil:
          type: string
          nullable: true
          example: "07:00"
          description: "Oyna yarim tundan o'tishi mumkin — 22:00–07:00 odatiy holat"

    NotificationMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/NotificationCategory" }
        title: { type: string }
        body: { type: string }
        scheduledFor: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/NotificationStatus" }
        sentAt: { type: string, format: date-time, nullable: true }
        suppressedReason:
          type: string
          nullable: true
          enum: [notifications_off, category_off, quiet_hours, daily_cap, weekly_cap, no_device]

    NotificationTemplate:
      type: object
      required: [key, language, category, title, body]
      properties:
        key: { type: string, example: med_reminder }
        language: { type: string, enum: [uz, ru, en] }
        category: { $ref: "#/components/schemas/NotificationCategory" }
        title: { type: string, description: "{{name}} va {{time}} o'zgaruvchilari" }
        body: { type: string }
        active: { type: boolean, default: true }

    FrequencyCaps:
      type: object
      properties:
        maxPerDay: { type: integer, default: 6, minimum: 0, maximum: 50 }
        maxPerWeek: { type: integer, default: 25, minimum: 0, maximum: 300 }

    HealthProvider:
      type: string
      enum: [apple_health, health_connect, oura, garmin, whoop, fitbit, samsung_health, manual]
    HealthMetric:
      type: string
      enum:
        [steps, active_energy, distance, heart_rate, resting_heart_rate, hrv,
         respiratory_rate, body_temperature, sleep_duration, sleep_deep, sleep_rem, weight]

    HealthSampleInput:
      type: object
      required: [provider, externalId, metric, value, startedAt]
      properties:
        provider: { $ref: "#/components/schemas/HealthProvider" }
        externalId:
          type: string
          description: "Provayderning o'z identifikatori — qayta sinxronlashni xavfsiz qiladi"
        metric: { type: string, example: HKQuantityTypeIdentifierStepCount }
        value: { type: number }
        unit: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        sourceDevice: { type: string, nullable: true }

    IngestSamplesRequest:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/HealthSampleInput" }
        timezone: { type: string, nullable: true, example: Asia/Tashkent }

    IngestResult:
      type: object
      properties:
        accepted: { type: integer }
        updated: { type: integer }
        unmapped:
          type: array
          description: "Mosligi yo'q metrikalar — ilova ularni yuborishni to'xtatishi kerak"
          items: { type: string }
        rejected: { type: integer }
        daysAffected:
          type: array
          items: { type: string, format: date }

    DailyMetric:
      type: object
      properties:
        metric: { $ref: "#/components/schemas/HealthMetric" }
        value: { type: number }
        unit: { type: string }
        sampleCount: { type: integer }
        providers:
          type: array
          items: { $ref: "#/components/schemas/HealthProvider" }

    DailyHealth:
      type: object
      properties:
        date: { type: string, format: date }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/DailyMetric" }

    DailyHealthRange:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/DailyHealth" }

    ProviderStatus:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/HealthProvider" }
        connected: { type: boolean }
        lastSampleAt: { type: string, format: date-time, nullable: true }
        sampleCount: { type: integer, format: int64 }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/HealthMetric" }

    MetricMapping:
      type: object
      required: [provider, providerMetric, metric]
      properties:
        provider: { $ref: "#/components/schemas/HealthProvider" }
        providerMetric: { type: string }
        metric: { $ref: "#/components/schemas/HealthMetric" }
        providerUnit: { type: string, nullable: true }
        scale:
          type: number
          default: 1.0
          description: "Kanonik birlikka o'tkazish ko'paytiruvchisi — kJ dan kcal ga 0.239"
        active: { type: boolean, default: true }

    AdminSession:
      type: object
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, SUPPORT, ANALYST] }

    AdminUserSummary:
      type: object
      description: "Sog'liq ma'lumotlari ataylab yo'q — operator ularni ko'ra olmaydi."
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        language: { $ref: "#/components/schemas/Language" }
        lifeStage: { $ref: "#/components/schemas/LifeStage" }
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        registeredAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time, nullable: true }

    AdminUserCard:
      type: object
      properties:
        general: { $ref: "#/components/schemas/AdminUserSummary" }
        subscription:
          type: object
          properties:
            tier: { $ref: "#/components/schemas/SubscriptionTier" }
            source: { $ref: "#/components/schemas/SubscriptionSource" }
            expiresAt: { type: string, format: date-time, nullable: true }
            inGracePeriod: { type: boolean }
            history:
              type: array
              items:
                type: object
                properties:
                  source: { $ref: "#/components/schemas/SubscriptionSource" }
                  productId: { type: string, nullable: true }
                  startedAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time, nullable: true }
        technical:
          type: object
          properties:
            timezone: { type: string }
            devices:
              type: array
              items:
                type: object
                properties:
                  deviceId: { type: string }
                  platform: { type: string }
                  model: { type: string, nullable: true }
                  appVersion: { type: string, nullable: true }
                  lastSeenAt: { type: string, format: date-time }
            featureUsage:
              type: array
              items:
                type: object
                properties:
                  featureKey: { type: string }
                  usedToday: { type: integer }
                  usedThisMonth: { type: integer }

    FeatureDefinition:
      type: object
      properties:
        key: { type: string }
        description: { type: string }
        freeEnabled: { type: boolean }
        premiumEnabled: { type: boolean }
        freeDailyLimit: { type: integer, nullable: true }
        freeMonthlyLimit: { type: integer, nullable: true }
        premiumDailyLimit: { type: integer, nullable: true }
        premiumMonthlyLimit: { type: integer, nullable: true }

    UpdateFeatureDefinitionRequest:
      type: object
      required: [freeEnabled, premiumEnabled]
      properties:
        freeEnabled: { type: boolean }
        premiumEnabled: { type: boolean }
        freeDailyLimit: { type: integer, nullable: true }
        freeMonthlyLimit: { type: integer, nullable: true }
        premiumDailyLimit: { type: integer, nullable: true }
        premiumMonthlyLimit: { type: integer, nullable: true }

    AdminFlag:
      type: object
      properties:
        key: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        defaultValue: { type: boolean }
        rules:
          type: array
          items: { $ref: "#/components/schemas/FlagRule" }

    FlagRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        environment: { type: string, nullable: true, enum: [DEV, STAGE, PROD] }
        country: { type: string, nullable: true }
        language: { type: string, nullable: true }
        lifeStage: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        cohort: { type: string, nullable: true }
        rolloutPercentage: { type: integer, minimum: 0, maximum: 100 }
        value: { type: boolean }
        priority: { type: integer }

    CreateFlagRuleRequest:
      type: object
      properties:
        environment: { type: string, nullable: true }
        country: { type: string, nullable: true }
        language: { type: string, nullable: true }
        lifeStage: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        cohort: { type: string, nullable: true }
        rolloutPercentage: { type: integer, default: 100, minimum: 0, maximum: 100 }
        value: { type: boolean, default: true }
        priority: { type: integer, default: 100 }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorType: { type: string, enum: [user, admin, system] }
        actorId: { type: string, format: uuid, nullable: true }
        actorLabel: { type: string, nullable: true }
        action: { type: string, example: subscription.granted }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: { type: string }
        ip: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
