openapi: 3.0.3
info:
  title: SADORA API
  version: 0.1.0
  description: |
    SADORA — ayollar wellbeing platformasi. Sprint 1 qamrovi: autentifikatsiya,
    profil va onboarding, entitlements va limitlar, feature flags, admin panel API'si.

    Umumiy qoidalar:
      * Barcha javoblar `application/json`.
      * Xatolik doim `{ "error": { "code", "message", "details", "requestId" } }` ko'rinishida.
        Mijoz `code` bo'yicha shoxlanadi, `message` matniga tayanmaydi.
      * Vaqt qiymatlari ISO-8601 UTC instant (`2026-08-27T09:15:00Z`), sanalar `YYYY-MM-DD`.
      * Har bir javobda `X-Request-Id` sarlavhasi bor; xatolik hisobotlarida shuni yuboring.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.stage.sadora.uz
    description: Stage
  - url: https://api.sadora.uz
    description: Production

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Entitlements
  - name: Cycle
  - name: Mind
  - name: Nutrition
  - name: Meds
  - name: Notifications
  - name: Wearables
  - name: Insights
  - name: Learn
  - name: Billing
  - name: Community
  - name: AI
  - name: Admin

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Jarayon ishlayaptimi (bazaga tegmaydi)
      responses:
        "200": { $ref: "#/components/responses/Health" }

  /health/ready:
    get:
      tags: [Health]
      summary: Trafik qabul qilishga tayyormi (bazani ham tekshiradi)
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Health" }

  /v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: Telefonga OTP kod yuborish
      description: |
        Telefon raqami E.164 ga normallashtiriladi. Bir raqamga soatiga
        `OTP_MAX_PER_HOUR` martadan ko'p yuborilmaydi. `devCode` faqat dev/stage'da
        qaytariladi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "201":
          description: Kod yuborildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: OTP kodni tekshirish va kirish
      description: Foydalanuvchi topilmasa yangi hisob yaratiladi (`isNewUser = true`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerifyRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/auth/social:
    post:
      tags: [Auth]
      summary: Apple yoki Google orqali kirish
      description: |
        `idToken` provayderning JWKS kalitlari bo'yicha server tomonida tekshiriladi.
        Tasdiqlangan email mavjud hisobga ulanadi; tasdiqlanmagani ulanmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Tokenlarni yangilash
      description: |
        Refresh token aylanadi: ishlatilgani bekor qilinadi va o'rniga yangisi beriladi.
        Allaqachon ishlatilgan token qayta yuborilsa, butun oila bekor qilinadi va
        hodisa audit log'ga yoziladi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Chiqish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/bootstrap:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Sovuq startda kerak bo'lgan hamma narsa
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/Platform" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Profil
      responses:
        "200": { $ref: "#/components/responses/UserProfile" }
    patch:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Profilni qisman yangilash
      description: "`null` maydon — o'zgarishsiz qoldirish degani."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Hisobni o'chirishni boshlash
      description: Hisob `deletion_pending` holatiga o'tadi va barcha sessiyalar bekor qilinadi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/me/onboarding:
    post:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Onboarding'ni yakunlash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/me/consents:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Joriy roziliklar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consents" }
    put:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Roziliklarni yangilash
      description: Har bir o'zgarish `consent_events` jadvaliga alohida yozuv sifatida tushadi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentGrants" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consents" }

  /v1/me/devices:
    post:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Qurilmani ro'yxatdan o'tkazish yoki push tokenni yangilash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/entitlements:
    get:
      tags: [Entitlements]
      security: [{ bearerAuth: [] }]
      summary: Funksiyalar, limitlar va sarflangan miqdor
      description: |
        Kunlik va oylik hisob foydalanuvchining o'z vaqt mintaqasida yuritiladi,
        shuning uchun limit uning yarim tunida yangilanadi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }

  /v1/subscription:
    get:
      tags: [Entitlements]
      security: [{ bearerAuth: [] }]
      summary: Obuna holati
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionStatus" }

  /v1/feature-flags:
    get:
      tags: [Entitlements]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchi uchun hisoblangan bayroqlar
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/Platform" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlags" }

  /v1/cycle/status:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Bugungi holat — sikl kuni, faza, keyingi hayz
      description: |
        Sikl kuni va faza bitta manbadan hisoblanadi: qayd etilgan hayz o'z siklini
        belgilaydi, undan keyin prognoz panjarasi ishlatiladi. `phaseIsPredicted` — bu
        qiymat qayd etilgan fakt emas, xulosa ekanini bildiradi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/cycle/calendar:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Kalendar — kun bo'yicha faza, oqim va simptomlar soni
      description: |
        `isPredicted` alohida maydon: qayd etilgan kunlar to'ldirilgan, bashorat
        qilinganlari konturli chiziladi — rang hech qachon yagona indikator emas.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleCalendar" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/cycle/history:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Tugagan sikllar va statistika
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleHistory" }

  /v1/cycle/periods:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Qayd etilgan hayzlar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PeriodEntry" }
    post:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Hayzni qayd etish
      description: "`store_health` roziligi shart, aks holda `consent_required`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startedOn]
              properties:
                startedOn: { type: string, format: date }
                endedOn: { type: string, format: date, nullable: true }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/cycle/periods/{id}:
    patch:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Hayz yozuvini tahrirlash
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startedOn: { type: string, format: date, nullable: true }
                endedOn: { type: string, format: date, nullable: true }
                clearEnd:
                  type: boolean
                  default: false
                  description: "Xato bilan yopilgan hayzni qayta ochish"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Hayz yozuvini o'chirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/days:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Oraliqdagi kunlik yozuvlar
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLogRange" }

  /v1/days/{date}:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Bir kunlik yozuv
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200":
          description: "Yozuv yo'q bo'lsa ham bo'sh obyekt qaytadi"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLog" }
    put:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Kunlik yozuvni saqlash
      description: |
        Kunni butunlay almashtiradi — yuborilmagan maydon tozalanadi. Butunlay bo'sh
        so'rov kunni o'chiradi. `store_health` roziligi shart.
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDailyLogRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }
    delete:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Kunlik yozuvni o'chirish
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/symptoms:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Simptom katalogi
      description: |
        Bosqichga qarab filtrlanadi — issiqlik to'lqini menopauzada bor, siklda yo'q.
        Ro'yxat backend'da, shuning uchun uni ilovani yangilamasdan kengaytirish mumkin.
      parameters:
        - { name: lifeStage, in: query, schema: { $ref: "#/components/schemas/LifeStage" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SymptomDefinition" }

  /v1/mind/today:
    get:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Mind tab — check-in, kundalik, mashqlar va 14 kunlik o'rtachalar
      description: |
        O'rtachalar oddiy arifmetik o'rtacha, boshqa hech narsa emas — ekran
        "ko'pincha birga kuzatilgan" deydi, "sabab bo'lgan" demaydi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MindSummary" }

  /v1/mind/check-in:
    put:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Bugungi kayfiyat, energiya va stress
      description: |
        Kunlik yozuvning uch maydonini almashtiradi, qolganiga tegmaydi — o'sha kuni
        sikl kundaligidan yozilgan simptom yoki izoh o'chib ketmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MindCheckIn" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MindCheckIn" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/mind/journal:
    get:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Kundalik yozuvlari
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JournalEntry" }
    post:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Yangi kundalik yozuvi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, body]
              properties:
                date: { type: string, format: date }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/mind/journal/{id}:
    patch:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Yozuvni tahrirlash
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Yozuvni o'chirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/mind/practices:
    post:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Nafas mashqini qayd etish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds]
              properties:
                kind: { type: string, enum: [breathing, meditation, grounding] }
                durationSeconds: { type: integer, minimum: 1, maximum: 7200 }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MindPractice" }

  /v1/nutrition/today:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Bugungi ovqatlanish
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }

  /v1/nutrition/days/{date}:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Bir kunlik ovqatlanish
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }

  /v1/nutrition/meals:
    post:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Ovqat qo'shish
      description: |
        Makrolar yeyilgan holicha saqlanadi, katalogdan qayta hisoblanmaydi — katalog
        tuzatilsa, o'tgan martda nima yeganini jimgina o'zgartirib qo'ymasligi kerak.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogMealRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/nutrition/meals/{id}:
    delete:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Ovqatni o'chirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/nutrition/water:
    post:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Suv qo'shish yoki qaytarish
      description: "`ml` manfiy bo'lishi mumkin — ilovadagi «Qaytarish» shu yo'l bilan ishlaydi."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ml]
              properties: { ml: { type: integer, example: 250 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterState" }

  /v1/nutrition/goals:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Kunlik maqsadlar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionGoals" }
    put:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Maqsadlarni o'zgartirish
      description: |
        Chegaralar bor, lekin maqsad tanadan hisoblanmaydi — bu mahsulot bermaydigan
        parhez maslahati bo'lardi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionGoals" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionGoals" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/nutrition/foods:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Taom katalogi bo'yicha qidiruv
      parameters:
        - { name: q, in: query, schema: { type: string }, example: somsa }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FoodItem" }

  /v1/meds:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dorilar ro'yxati
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Medication" }
    post:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dori qo'shish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMedicationRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/meds/today:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Bugungi qabullar
      description: |
        Qabullar jadvaldan hisoblanadi, oldindan yozilmaydi — kursni o'zgartirish
        kelajakdagi qator qoldiqlarini qoldirmaydi. Faqat foydalanuvchi qilgan ish
        saqlanadi; yozuvi yo'q qabul — `pending`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDay" }

  /v1/meds/days/{date}:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Bir kunlik qabullar
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDay" }

  /v1/meds/{id}:
    put:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dorini tahrirlash
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMedicationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medication" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dorini arxivlash
      description: |
        O'chirmaydi — `active: false` qilib, `endedOn` ni bugunga qo'yadi. Qabul tarixi
        saqlanib qoladi: «martda ichganmidim» degan savol javobsiz qolmasligi kerak.
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/meds/{id}/doses:
    post:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Qabulni belgilash
      description: |
        `taken` yoki `skipped`. `pending` yuborilsa yozuv o'chiriladi — xato bosishni
        qaytarish shu. Zaxira faqat `taken` ga kirish va undan chiqishda o'zgaradi,
        shuning uchun ikki marta bosish ikki dozani yechib olmaydi.
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueOn, dueAt, status]
              properties:
                dueOn: { type: string, format: date }
                dueAt: { type: string, example: "08:00" }
                status: { type: string, enum: [pending, taken, skipped] }
      responses:
        "200":
          description: Yangilangan kun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDay" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/meds/{id}/stock:
    post:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Zaxirani to'ldirish
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units: { type: integer, description: "Manfiy qiymat ortiqcha hisobni tuzatadi" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medication" }

  /v1/meds/{id}/history:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Qabul tarixi
      description: |
        Faqat sanoq: nechta qabul qilingan, o'tkazilgan, kutilmoqda. Ataylab ball ham,
        maslahat ham yo'q — ilova o'tkazib yuborilgan qabul haqida ko'rsatma bermaydi,
        retsept yoki farmatsevtga yo'naltiradi.
      parameters:
        - { $ref: "#/components/parameters/MedicationId" }
        - { name: days, in: query, schema: { type: integer, default: 14, maximum: 180 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationHistory" }

  /v1/notifications/settings:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Bildirishnoma sozlamalari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Sozlamalarni o'zgartirish
      description: |
        Sokin oynaning ikkala chegarasi birga beriladi — yarmi qolsa, oyna yo hech
        narsani, yo hamma narsani o'chirib qo'yardi. `clearQuietHours` oynani olib
        tashlaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, nullable: true }
                categories:
                  type: object
                  nullable: true
                  additionalProperties: { type: boolean }
                quietFrom: { type: string, nullable: true, example: "22:00" }
                quietUntil: { type: string, nullable: true, example: "07:00" }
                clearQuietHours: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/notifications/history:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Yuborilgan va to'xtatilgan bildirishnomalar
      description: |
        To'xtatilganlari ham sababi bilan ko'rinadi — «nega eslatma kelmadi» degan
        savolga javob beradigan yagona narsa shu.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationMessage" }

  /v1/admin/notifications/templates:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Bildirishnoma shablonlari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationTemplate" }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Shablonni saqlash
      description: "Matn backend'da — so'zlashni tuzatish yoki tarjima qo'shish reliz talab qilmaydi."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplate" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/notifications/caps:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Chastota chegaralari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequencyCaps" }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Chegaralarni o'zgartirish
      description: |
        Dori eslatmalari va tizim xabarlari chegaraga bo'ysunmaydi — o'z vaqtida
        qo'yilgan eslatmani byudjet uchun ushlab qolish ilovaning asosiy vazifasini
        bajarmasligi bo'lardi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FrequencyCaps" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequencyCaps" }

  /v1/health-data/samples:
    post:
      tags: [Wearables]
      security: [{ bearerAuth: [] }]
      summary: Qurilmadan namunalarni yuborish
      description: |
        HealthKit va Health Connect qurilmada o'qiladi — ular platformaga xos API'lar va
        native qoladi — natija esa shu yerga to'plam bo'lib yuboriladi.
        `externalId` bo'yicha takrorlanmaydi: bir xil namuna ikkinchi marta kelsa,
        qator yangilanadi, qadamlar ikkilanmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestSamplesRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/health-data/today:
    get:
      tags: [Wearables]
      security: [{ bearerAuth: [] }]
      summary: Bugungi jamlanma
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHealth" }

  /v1/health-data/daily:
    get:
      tags: [Wearables]
      security: [{ bearerAuth: [] }]
      summary: Kunlik jamlanmalar oralig'i
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHealthRange" }

  /v1/health-data/sources:
    get:
      tags: [Wearables]
      security: [{ bearerAuth: [] }]
      summary: Data Sources ekrani — ulangan manbalar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderStatus" }

  /v1/admin/wearables/providers:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Provayderlar holati (11-sahifa)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: { $ref: "#/components/schemas/HealthProvider" }
                    sampleCount: { type: integer, format: int64 }
                    lastSampleAt: { type: string, nullable: true }

  /v1/admin/wearables/mappings:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Ma'lumot moslashtirish jadvali (12-sahifa)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricMapping" }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Moslikni saqlash
      description: |
        Yangi provayder qo'shish yoki maydon nomini o'zgartirgan provayderga ergashish —
        shu yerdagi bitta qator. Migratsiya ham, reliz ham kerak emas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricMapping" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/insights:
    get:
      tags: [Insights]
      security: [{ bearerAuth: [] }]
      summary: Trendlar va kuzatilgan bog'liqliklar
      description: |
        Har bir raqam o'lchangan. Yozuv bo'lmagan kun `null` bo'lib qaytadi — nol emas,
        aks holda dam olingan hafta qulagandek ko'rinadi; o'rtacha ham hech narsadan
        hisoblanmaydi.

        `previousAverage` — xuddi shu uzunlikdagi oldingi oyna, shuning uchun mijoz
        "+12 daqiqa" ni o'zi hisoblamaydi.

        Chuqurlik va hikoya alohida entitlement: 7 kun hammaga, 30 va 90 kun
        `insights_history` bilan (`402 entitlement_required`), bog'liqliklar esa
        `ai_insights` bilan — usiz `findings` bo'sh va `findingsAvailable: false`.
        Bog'liqlik kamida sakkiz kunlik yozuvdan va sezilarli farqdan chiqadi; aks holda
        hech narsa qaytmaydi.
      parameters:
        - in: query
          name: days
          schema: { type: integer, enum: [7, 30, 90], default: 7 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsightsSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/EntitlementRequired" }

  /v1/articles:
    get:
      tags: [Learn]
      security: [{ bearerAuth: [] }]
      summary: Bilim kutubxonasi — kategoriyalar va kartochkalar
      description: |
        Kutubxona to'liq qaytadi: chiplar (`categories`) va ular ortidagi kartochkalar bir
        so'rovda, chunki filtr har safar sahifa yuklanishiga o'xshamasligi kerak.

        Qoralama hech qachon chiqmaydi. Premium maqola esa hammaga ko'rinadi va
        `locked: true` bilan belgilanadi — yopiladigan narsa ro'yxat emas, tanasi.
      parameters:
        - in: query
          name: category
          schema: { type: string }
          description: Kategoriya kaliti; berilmasa butun kutubxona.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleFeed" }

  /v1/articles/{slug}:
    get:
      tags: [Learn]
      security: [{ bearerAuth: [] }]
      summary: Bitta maqola
      description: |
        Yopiq maqola ham 200 bilan qaytadi: birinchi xatboshi va `truncated: true`. Bo'sh
        sahifa ustidagi paywall nima sotilayotganini ko'rsatmaydi, shuning uchun ochiq
        qismi beriladi va qolgani berilmaydi.

        Chop etilmagan maqola — `404`, xuddi mavjud bo'lmagani kabi.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/billing/plans:
    get:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      summary: Tariflar va ochiq to'lov usullari
      description: |
        Narx `priceMinor` — tiyinda, butun son. Ilova uni faqat formatlaydi; hisob-kitob
        hech qachon formatlangan matn ustida bo'lmaydi.

        `providers` — hozir haqiqatan ochiq usullar. Sozlanmagan provayder ro'yxatga
        tushmaydi: havola yasay olmaydigan tugma umuman yo'q tugmadan yomonroq.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCatalogue" }

  /v1/billing/checkout:
    post:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      summary: To'lov havolasini olish
      description: |
        Faqat `pending` yozuv va provayderning havolasini yaratadi. Bu yerda hech kimga
        hech narsa berilmaydi — obuna provayder to'lovni tasdiqlaganidan keyin paydo
        bo'ladi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/FeatureDisabled" }

  /v1/billing/payments/{id}:
    get:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      summary: To'lov holati
      description: |
        Provayder sahifasidan qaytgach so'raladi. Boshqa hisobning to'lovi `404` — uning
        mavjudligi ham so'ragan odamning ishi emas.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/billing/store/verify:
    post:
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      summary: App Store / Google Play chekini tasdiqlash
      description: |
        Chek store'dan tasdiqlanadi, mijozning so'zidan emas. Kalitlar sozlanmagan
        bo'lsa — `400`, chunki tasdiqlab bo'lmagan chek hech narsa bermaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorePurchaseRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/payments/payme:
    post:
      tags: [Billing]
      summary: Payme Merchant API (provayder chaqiradi)
      description: |
        Payme'ning JSON-RPC protokoli: `CheckPerformTransaction`, `CreateTransaction`,
        `PerformTransaction`, `CancelTransaction`, `CheckTransaction`, `GetStatement`.
        Autentifikatsiya — Basic `Paycom:<key>`, va javob har doim `200`: Payme status
        kodini emas, konvertni o'qiydi, xato ham `error` obyekti sifatida qaytadi.

        Har bir metod idempotent: Payme qayta so'raydi, va ikkinchi `PerformTransaction`
        yangi obuna emas, o'sha javobni beradi.
      responses:
        "200":
          description: Payme JSON-RPC konverti (natija yoki xato)

  /v1/payments/click/prepare:
    post:
      tags: [Billing]
      summary: Click Prepare (provayder chaqiradi)
      description: |
        Form-encoded so'rov, MD5 imzo bilan. Imzo noto'g'ri bo'lsa — `200` va
        `error: -1`; buyurtma umuman qimirlamaydi.
      responses:
        "200":
          description: Click javob konverti

  /v1/payments/click/complete:
    post:
      tags: [Billing]
      summary: Click Complete (provayder chaqiradi)
      description: |
        Imzoga `merchant_prepare_id` ham qo'shiladi. Takroriy Complete yangi obuna
        bermaydi. Click o'z xatosini manfiy `error` bilan yuboradi — bunda buyurtma
        to'lanmagan holatiga qaytadi.
      responses:
        "200":
          description: Click javob konverti

  /v1/community/me:
    get:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Maxfiy chatdagi taxallus
      description: |
        Birinchi murojaatda beriladi va hech qachon o'zgarmaydi. Serverdan tashqarida
        taxallusni hisobga bog'laydigan hech narsa yo'q — admin API ham buni qaytarmaydi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityIdentity" }
        "403": { $ref: "#/components/responses/FeatureDisabled" }

  /v1/community/posts:
    get:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Lenta — ko'rinadigan postlar, yangisi birinchi
      parameters:
        - in: query
          name: topic
          schema: { $ref: "#/components/schemas/CommunityTopic" }
        - in: query
          name: saved
          schema: { type: boolean }
          description: Faqat o'zi saqlagan postlar
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CommunityPost" }
        "403": { $ref: "#/components/responses/FeatureDisabled" }
    post:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Yangi post
      description: |
        Kuniga 10 tagacha. Moderator cheklagan muallif `403 forbidden` oladi; yopiq
        bo'lim `403 feature_disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePostRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/community/posts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Bitta post
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityPost" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: O'z postini o'chirish
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/community/posts/{id}/comments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Postning izohlari, eskisi birinchi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunityComment" }
    post:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Izoh qoldirish (kuniga 60 tagacha)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 2, maxLength: 1000 }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityComment" }

  /v1/community/posts/{id}/like:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Yoqdi (idempotent)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
    delete:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Yoqdi'ni olib tashlash
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }

  /v1/community/posts/{id}/save:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Saqlash
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
    delete:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Saqlanganlardan olib tashlash
      responses:
        "200":
          description: OK

  /v1/community/posts/{id}/report:
    post:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Postga shikoyat
      description: |
        Har o'quvchi bir postga bir marta; o'z postiga shikoyat qilib bo'lmaydi. Beshta
        ochiq shikoyat postni o'zi yashiradi — moderator uni qaytarishi mumkin.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "409":
          description: Allaqachon shikoyat qilingan

  /v1/community/comments/{id}:
    delete:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: O'z izohini o'chirish
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/community/comments/{id}/report:
    post:
      tags: [Community]
      security: [{ bearerAuth: [] }]
      summary: Izohga shikoyat
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/ai/chat/quota:
    get:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: Bugun va shu oyda nechta savol qolgani
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatQuota" }

  /v1/ai/chat:
    post:
      tags: [AI]
      security: [{ bearerAuth: [] }]
      summary: SADORA AI'ga savol
      description: |
        Javobdan oldin `ai_chat` limiti sarflanadi (`429 limit_reached`, `402
        entitlement_required`). `ai_chat_enabled` bayrog'i o'chiq bo'lsa `403
        feature_disabled`. Foydalanuvchi ma'lumotlari faqat `ai_insights` roziligi bilan
        o'qiladi; roziliksiz javob umumiy bo'ladi va `basedOn` bo'sh qaytadi. Suhbat
        saqlanmaydi.

        Javobni model yozadi. Kalit bo'lmasa, `ai_model_enabled` o'chirilgan bo'lsa yoki
        model qoqilsa — o'sha savolga qoidalar javob beradi va so'rov baribir `200`
        qaytaradi: bu xato emas, javobdir. Farq `ai_usage_log` da qoladi (matnsiz).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatReply" }
        "402": { $ref: "#/components/responses/EntitlementRequired" }
        "403": { $ref: "#/components/responses/FeatureDisabled" }
        "429": { $ref: "#/components/responses/LimitReached" }

  /v1/admin/community/stats:
    get:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Maxfiy chat ko'rsatkichlari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  postsTotal: { type: integer }
                  postsToday: { type: integer }
                  hiddenPosts: { type: integer }
                  openReports: { type: integer }

  /v1/admin/community/posts:
    get:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Moderatsiya navbati — faqat taxallus va matn
      description: |
        Hech bir moderatsiya javobida foydalanuvchi ID'si yo'q. Muallifga ta'sir
        qiladigan yagona amal — `restrict-author` — post orqali qo'llanadi.
      parameters:
        - in: query
          name: hidden
          schema: { type: boolean }
        - in: query
          name: topic
          schema: { $ref: "#/components/schemas/CommunityTopic" }
        - in: query
          name: reported
          schema: { type: boolean }
          description: Faqat ochiq shikoyati borlar
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ModerationPost" }

  /v1/admin/community/posts/{id}/comments:
    get:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Postning izohlari, yashirilganlari bilan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK

  /v1/admin/community/posts/{id}/hide:
    post:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Postni yashirish yoki qaytarish (Owner, Admin)
      description: Yashirish undagi ochiq shikoyatlarni ham yopadi. Sabab audit log'ga yoziladi.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
                reason: { type: string, description: "Yashirishda majburiy" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/community/posts/{id}/restrict-author:
    post:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Post muallifini yozishdan cheklash (Owner, Admin)
      description: |
        Muallif post orqali topiladi; javobda ham, audit yozuvida ham uning ID'si yo'q.
        `days` bo'sh bo'lsa — moderator ochguncha.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                days: { type: integer, minimum: 1, maximum: 365, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/community/comments/{id}/hide:
    post:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Izohni yashirish yoki qaytarish (Owner, Admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/community/reports:
    get:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Shikoyatlar
      parameters:
        - in: query
          name: open
          schema: { type: boolean, default: true }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ModerationReport" }

  /v1/admin/community/reports/{id}/resolve:
    post:
      tags: [Admin]
      security: [{ adminAuth: [] }]
      summary: Shikoyatni ko'rib chiqish (Owner, Admin)
      description: "`dismiss` — matn qoladi; `hide` — matn yashiriladi. Ikkalasi ham shu matnga tegishli barcha ochiq shikoyatlarni yopadi."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, hide] }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/auth/login:
    post:
      tags: [Admin]
      summary: Admin panelga kirish (email + parol + 2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                totpCode: { type: string, description: "2FA yoqilgan bo'lsa majburiy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchilar ro'yxati
      description: |
        Rollar: Owner, Admin, Support, Analyst. Javobda sog'liq ma'lumotlari yo'q —
        faqat hisob va texnik metadata (TZ 17-bo'lim).
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "email / telefon / ism" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AccountStatus" } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/Language" } }
        - { name: lifeStage, in: query, schema: { $ref: "#/components/schemas/LifeStage" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserSummary" }
                  total: { type: integer, format: int64 }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{id}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchi kartochkasi (Umumiy / Obuna / Texnik)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserCard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{id}/block:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Hisobni bloklash yoki blokdan chiqarish
      description: Sabab majburiy va audit log'ga tushadi. Bloklashda barcha sessiyalar bekor qilinadi.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked, reason]
              properties:
                blocked: { type: boolean }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/users/{id}/premium:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Qo'lda Premium berish
      description: Firibgarlikdan himoya sifatida sabab majburiy va audit yozuvi yaratiladi.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                expiresAt: { type: string, format: date-time, nullable: true }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/features:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Entitlements va limitlar jadvali
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureDefinition" }

  /v1/admin/features/{key}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Funksiya limitlarini o'zgartirish
      description: O'zgarish ilovani yangilamasdan kuchga kiradi.
      parameters: [{ $ref: "#/components/parameters/FeatureKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeatureDefinitionRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{id}/features/{key}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchi uchun alohida override o'rnatish
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/FeatureKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                enabled: { type: boolean, nullable: true }
                dailyLimit: { type: integer, nullable: true }
                monthlyLimit: { type: integer, nullable: true }
                reason: { type: string, minLength: 1 }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Override'ni olib tashlash
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/FeatureKey" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/flags:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Feature flags va ularning qoidalari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminFlag" }

  /v1/admin/flags/{key}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Bayroqni yoqish/o'chirish (kill switch)
      parameters: [{ $ref: "#/components/parameters/FlagKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, defaultValue]
              properties:
                enabled: { type: boolean }
                defaultValue: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/flags/{key}/rules:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Targeting qoidasi qo'shish
      description: |
        `rolloutPercentage` foydalanuvchi id va bayroq kalitidan olingan barqaror hash
        bo'yicha bo'linadi — 5% dan 20% ga kengaytirish faqat yangi foydalanuvchi qo'shadi.
      parameters: [{ $ref: "#/components/parameters/FlagKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFlagRuleRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }

  /v1/admin/flags/{key}/rules/{ruleId}:
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Qoidani o'chirish
      parameters:
        - { $ref: "#/components/parameters/FlagKey" }
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/audit:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Audit log (faqat Owner)
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  total: { type: integer, format: int64 }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeatureKey:
      name: key
      in: path
      required: true
      schema: { type: string, example: ai_chat }
    FlagKey:
      name: key
      in: path
      required: true
      schema: { type: string, example: ai_chat_enabled }
    LogDate:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    MedicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Health:
      description: Holat
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              environment: { type: string }
              version: { type: string }
    Ack:
      description: Bajarildi
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
    AuthSession:
      description: Sessiya
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthSession" }
    UserProfile:
      description: Profil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserProfile" }
    BadRequest:
      description: So'rov noto'g'ri
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: Avtorizatsiya talab qilinadi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Forbidden:
      description: Ruxsat yo'q
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    NotFound:
      description: Topilmadi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Conflict:
      description: Ziddiyat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ConsentRequired:
      description: "Sog'liq ma'lumotlarini saqlash roziligi berilmagan"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    FeatureDisabled:
      description: Operator bu bo'limni bayroq bilan yopgan (`feature_disabled`); obuna yordam bermaydi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    EntitlementRequired:
      description: Funksiya bu tarifda yo'q (`entitlement_required`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    LimitReached:
      description: Kunlik yoki oylik limit tugagan (`limit_reached`, `details.period`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    RateLimited:
      description: Juda ko'p so'rov
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    Language:
      type: string
      enum: [uz, ru, en]
    LifeStage:
      type: string
      enum: [cycle, trying_to_conceive, pregnancy, postpartum, perimenopause, menopause]
    Goal:
      type: string
      enum:
        [understand_cycle, sleep_better, more_energy, less_stress, eat_balanced,
         drink_water, be_active, remember_meds]
    Platform:
      type: string
      enum: [ios, android, web]
    AccountStatus:
      type: string
      enum: [active, blocked, deletion_pending]
    SubscriptionTier:
      type: string
      enum: [free, premium]
    SubscriptionSource:
      type: string
      enum: [app_store, google_play, payme, click, manual]
    AuthProvider:
      type: string
      enum: [phone, apple, google]

    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [validation_failed, unauthorized, forbidden, not_found, conflict,
                 rate_limited, otp_invalid, otp_expired, otp_too_many_attempts,
                 token_expired, token_revoked, social_token_invalid, account_blocked,
                 entitlement_required, consent_required, limit_reached, feature_disabled,
                 internal_error]
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
            requestId: { type: string, nullable: true }

    DeviceInfo:
      type: object
      required: [deviceId, platform]
      properties:
        deviceId: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        osVersion: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        model: { type: string, nullable: true }
        pushToken: { type: string, nullable: true }
        timezone: { type: string, nullable: true, example: Asia/Tashkent }

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+998901234567" }
        language: { $ref: "#/components/schemas/Language" }

    OtpChallenge:
      type: object
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer }
        attemptsLeft: { type: integer }
        devCode: { type: string, nullable: true, description: "Faqat dev/stage" }

    OtpVerifyRequest:
      type: object
      required: [challengeId, code, device]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, example: "123456" }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    SocialSignInRequest:
      type: object
      required: [provider, idToken, device]
      properties:
        provider: { type: string, enum: [apple, google] }
        idToken: { type: string }
        fullName: { type: string, nullable: true, description: "Apple ismni faqat bir marta beradi" }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true }
        allDevices: { type: boolean, default: false }

    TokenPair:
