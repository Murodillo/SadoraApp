        inGracePeriod: { type: boolean }
        evaluatedAt: { type: string, format: date-time }

    SubscriptionStatus:
      type: object
      properties:
        tier: { $ref: "#/components/schemas/SubscriptionTier" }
        source: { $ref: "#/components/schemas/SubscriptionSource" }
