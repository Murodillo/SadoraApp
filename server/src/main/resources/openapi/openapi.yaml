openapi: 3.0.3
info:
  title: SADORA API
  version: 0.1.0
  description: |
    SADORA — ayollar wellbeing platformasi. Sprint 1 qamrovi: autentifikatsiya,
    profil va onboarding, entitlements va limitlar, feature flags, admin panel API'si.

    Umumiy qoidalar:
      * Barcha javoblar `application/json`.
      * Xatolik doim `{ "error": { "code", "message", "details", "requestId" } }` ko'rinishida.
        Mijoz `code` bo'yicha shoxlanadi, `message` matniga tayanmaydi.
      * Vaqt qiymatlari ISO-8601 UTC instant (`2026-08-27T09:15:00Z`), sanalar `YYYY-MM-DD`.
      * Har bir javobda `X-Request-Id` sarlavhasi bor; xatolik hisobotlarida shuni yuboring.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.stage.sadora.uz
    description: Stage
  - url: https://api.sadora.uz
    description: Production

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Entitlements
  - name: Cycle
  - name: Mind
  - name: Nutrition
  - name: Meds
  - name: Notifications
  - name: Admin

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Jarayon ishlayaptimi (bazaga tegmaydi)
      responses:
        "200": { $ref: "#/components/responses/Health" }

  /health/ready:
    get:
      tags: [Health]
      summary: Trafik qabul qilishga tayyormi (bazani ham tekshiradi)
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Health" }

  /v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: Telefonga OTP kod yuborish
      description: |
        Telefon raqami E.164 ga normallashtiriladi. Bir raqamga soatiga
        `OTP_MAX_PER_HOUR` martadan ko'p yuborilmaydi. `devCode` faqat dev/stage'da
        qaytariladi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "201":
          description: Kod yuborildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: OTP kodni tekshirish va kirish
      description: Foydalanuvchi topilmasa yangi hisob yaratiladi (`isNewUser = true`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerifyRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/auth/social:
    post:
      tags: [Auth]
      summary: Apple yoki Google orqali kirish
      description: |
        `idToken` provayderning JWKS kalitlari bo'yicha server tomonida tekshiriladi.
        Tasdiqlangan email mavjud hisobga ulanadi; tasdiqlanmagani ulanmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/email/register:
    post:
      tags: [Auth]
      summary: Email va parol bilan ro'yxatdan o'tish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/auth/email/login:
    post:
      tags: [Auth]
      summary: Email va parol bilan kirish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSignInRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Tokenlarni yangilash
      description: |
        Refresh token aylanadi: ishlatilgani bekor qilinadi va o'rniga yangisi beriladi.
        Allaqachon ishlatilgan token qayta yuborilsa, butun oila bekor qilinadi va
        hodisa audit log'ga yoziladi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Chiqish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/bootstrap:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Sovuq startda kerak bo'lgan hamma narsa
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/Platform" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Profil
      responses:
        "200": { $ref: "#/components/responses/UserProfile" }
    patch:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Profilni qisman yangilash
      description: "`null` maydon — o'zgarishsiz qoldirish degani."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Hisobni o'chirishni boshlash
      description: Hisob `deletion_pending` holatiga o'tadi va barcha sessiyalar bekor qilinadi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/me/onboarding:
    post:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Onboarding'ni yakunlash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/me/consents:
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Joriy roziliklar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consents" }
    put:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Roziliklarni yangilash
      description: Har bir o'zgarish `consent_events` jadvaliga alohida yozuv sifatida tushadi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentGrants" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consents" }

  /v1/me/devices:
    post:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Qurilmani ro'yxatdan o'tkazish yoki push tokenni yangilash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/entitlements:
    get:
      tags: [Entitlements]
      security: [{ bearerAuth: [] }]
      summary: Funksiyalar, limitlar va sarflangan miqdor
      description: |
        Kunlik va oylik hisob foydalanuvchining o'z vaqt mintaqasida yuritiladi,
        shuning uchun limit uning yarim tunida yangilanadi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }

  /v1/subscription:
    get:
      tags: [Entitlements]
      security: [{ bearerAuth: [] }]
      summary: Obuna holati
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionStatus" }

  /v1/feature-flags:
    get:
      tags: [Entitlements]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchi uchun hisoblangan bayroqlar
      parameters:
        - { name: platform, in: query, schema: { $ref: "#/components/schemas/Platform" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlags" }

  /v1/cycle/status:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Bugungi holat — sikl kuni, faza, keyingi hayz
      description: |
        Sikl kuni va faza bitta manbadan hisoblanadi: qayd etilgan hayz o'z siklini
        belgilaydi, undan keyin prognoz panjarasi ishlatiladi. `phaseIsPredicted` — bu
        qiymat qayd etilgan fakt emas, xulosa ekanini bildiradi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/cycle/calendar:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Kalendar — kun bo'yicha faza, oqim va simptomlar soni
      description: |
        `isPredicted` alohida maydon: qayd etilgan kunlar to'ldirilgan, bashorat
        qilinganlari konturli chiziladi — rang hech qachon yagona indikator emas.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleCalendar" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/cycle/history:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Tugagan sikllar va statistika
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleHistory" }

  /v1/cycle/periods:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Qayd etilgan hayzlar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PeriodEntry" }
    post:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Hayzni qayd etish
      description: "`store_health` roziligi shart, aks holda `consent_required`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startedOn]
              properties:
                startedOn: { type: string, format: date }
                endedOn: { type: string, format: date, nullable: true }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/cycle/periods/{id}:
    patch:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Hayz yozuvini tahrirlash
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startedOn: { type: string, format: date, nullable: true }
                endedOn: { type: string, format: date, nullable: true }
                clearEnd:
                  type: boolean
                  default: false
                  description: "Xato bilan yopilgan hayzni qayta ochish"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Hayz yozuvini o'chirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/days:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Oraliqdagi kunlik yozuvlar
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLogRange" }

  /v1/days/{date}:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Bir kunlik yozuv
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200":
          description: "Yozuv yo'q bo'lsa ham bo'sh obyekt qaytadi"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLog" }
    put:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Kunlik yozuvni saqlash
      description: |
        Kunni butunlay almashtiradi — yuborilmagan maydon tozalanadi. Butunlay bo'sh
        so'rov kunni o'chiradi. `store_health` roziligi shart.
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDailyLogRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyLog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }
    delete:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Kunlik yozuvni o'chirish
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/symptoms:
    get:
      tags: [Cycle]
      security: [{ bearerAuth: [] }]
      summary: Simptom katalogi
      description: |
        Bosqichga qarab filtrlanadi — issiqlik to'lqini menopauzada bor, siklda yo'q.
        Ro'yxat backend'da, shuning uchun uni ilovani yangilamasdan kengaytirish mumkin.
      parameters:
        - { name: lifeStage, in: query, schema: { $ref: "#/components/schemas/LifeStage" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SymptomDefinition" }

  /v1/mind/today:
    get:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Mind tab — check-in, kundalik, mashqlar va 14 kunlik o'rtachalar
      description: |
        O'rtachalar oddiy arifmetik o'rtacha, boshqa hech narsa emas — ekran
        "ko'pincha birga kuzatilgan" deydi, "sabab bo'lgan" demaydi.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MindSummary" }

  /v1/mind/check-in:
    put:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Bugungi kayfiyat, energiya va stress
      description: |
        Kunlik yozuvning uch maydonini almashtiradi, qolganiga tegmaydi — o'sha kuni
        sikl kundaligidan yozilgan simptom yoki izoh o'chib ketmaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MindCheckIn" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MindCheckIn" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/mind/journal:
    get:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Kundalik yozuvlari
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JournalEntry" }
    post:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Yangi kundalik yozuvi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, body]
              properties:
                date: { type: string, format: date }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/mind/journal/{id}:
    patch:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Yozuvni tahrirlash
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Yozuvni o'chirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/mind/practices:
    post:
      tags: [Mind]
      security: [{ bearerAuth: [] }]
      summary: Nafas mashqini qayd etish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds]
              properties:
                kind: { type: string, enum: [breathing, meditation, grounding] }
                durationSeconds: { type: integer, minimum: 1, maximum: 7200 }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MindPractice" }

  /v1/nutrition/today:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Bugungi ovqatlanish
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }

  /v1/nutrition/days/{date}:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Bir kunlik ovqatlanish
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }

  /v1/nutrition/meals:
    post:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Ovqat qo'shish
      description: |
        Makrolar yeyilgan holicha saqlanadi, katalogdan qayta hisoblanmaydi — katalog
        tuzatilsa, o'tgan martda nima yeganini jimgina o'zgartirib qo'ymasligi kerak.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogMealRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/nutrition/meals/{id}:
    delete:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Ovqatni o'chirish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/nutrition/water:
    post:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Suv qo'shish yoki qaytarish
      description: "`ml` manfiy bo'lishi mumkin — ilovadagi «Qaytarish» shu yo'l bilan ishlaydi."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ml]
              properties: { ml: { type: integer, example: 250 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterState" }

  /v1/nutrition/goals:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Kunlik maqsadlar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionGoals" }
    put:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Maqsadlarni o'zgartirish
      description: |
        Chegaralar bor, lekin maqsad tanadan hisoblanmaydi — bu mahsulot bermaydigan
        parhez maslahati bo'lardi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NutritionGoals" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionGoals" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/nutrition/foods:
    get:
      tags: [Nutrition]
      security: [{ bearerAuth: [] }]
      summary: Taom katalogi bo'yicha qidiruv
      parameters:
        - { name: q, in: query, schema: { type: string }, example: somsa }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FoodItem" }

  /v1/meds:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dorilar ro'yxati
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Medication" }
    post:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dori qo'shish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMedicationRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ConsentRequired" }

  /v1/meds/today:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Bugungi qabullar
      description: |
        Qabullar jadvaldan hisoblanadi, oldindan yozilmaydi — kursni o'zgartirish
        kelajakdagi qator qoldiqlarini qoldirmaydi. Faqat foydalanuvchi qilgan ish
        saqlanadi; yozuvi yo'q qabul — `pending`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDay" }

  /v1/meds/days/{date}:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Bir kunlik qabullar
      parameters: [{ $ref: "#/components/parameters/LogDate" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDay" }

  /v1/meds/{id}:
    put:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dorini tahrirlash
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveMedicationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medication" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Dorini arxivlash
      description: |
        O'chirmaydi — `active: false` qilib, `endedOn` ni bugunga qo'yadi. Qabul tarixi
        saqlanib qoladi: «martda ichganmidim» degan savol javobsiz qolmasligi kerak.
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/meds/{id}/doses:
    post:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Qabulni belgilash
      description: |
        `taken` yoki `skipped`. `pending` yuborilsa yozuv o'chiriladi — xato bosishni
        qaytarish shu. Zaxira faqat `taken` ga kirish va undan chiqishda o'zgaradi,
        shuning uchun ikki marta bosish ikki dozani yechib olmaydi.
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueOn, dueAt, status]
              properties:
                dueOn: { type: string, format: date }
                dueAt: { type: string, example: "08:00" }
                status: { type: string, enum: [pending, taken, skipped] }
      responses:
        "200":
          description: Yangilangan kun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDay" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/meds/{id}/stock:
    post:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Zaxirani to'ldirish
      parameters: [{ $ref: "#/components/parameters/MedicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units: { type: integer, description: "Manfiy qiymat ortiqcha hisobni tuzatadi" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Medication" }

  /v1/meds/{id}/history:
    get:
      tags: [Meds]
      security: [{ bearerAuth: [] }]
      summary: Qabul tarixi
      description: |
        Faqat sanoq: nechta qabul qilingan, o'tkazilgan, kutilmoqda. Ataylab ball ham,
        maslahat ham yo'q — ilova o'tkazib yuborilgan qabul haqida ko'rsatma bermaydi,
        retsept yoki farmatsevtga yo'naltiradi.
      parameters:
        - { $ref: "#/components/parameters/MedicationId" }
        - { name: days, in: query, schema: { type: integer, default: 14, maximum: 180 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationHistory" }

  /v1/notifications/settings:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Bildirishnoma sozlamalari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Sozlamalarni o'zgartirish
      description: |
        Sokin oynaning ikkala chegarasi birga beriladi — yarmi qolsa, oyna yo hech
        narsani, yo hamma narsani o'chirib qo'yardi. `clearQuietHours` oynani olib
        tashlaydi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, nullable: true }
                categories:
                  type: object
                  nullable: true
                  additionalProperties: { type: boolean }
                quietFrom: { type: string, nullable: true, example: "22:00" }
                quietUntil: { type: string, nullable: true, example: "07:00" }
                clearQuietHours: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/notifications/history:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Yuborilgan va to'xtatilgan bildirishnomalar
      description: |
        To'xtatilganlari ham sababi bilan ko'rinadi — «nega eslatma kelmadi» degan
        savolga javob beradigan yagona narsa shu.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationMessage" }

  /v1/admin/notifications/templates:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Bildirishnoma shablonlari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationTemplate" }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Shablonni saqlash
      description: "Matn backend'da — so'zlashni tuzatish yoki tarjima qo'shish reliz talab qilmaydi."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplate" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/notifications/caps:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Chastota chegaralari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequencyCaps" }
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Chegaralarni o'zgartirish
      description: |
        Dori eslatmalari va tizim xabarlari chegaraga bo'ysunmaydi — o'z vaqtida
        qo'yilgan eslatmani byudjet uchun ushlab qolish ilovaning asosiy vazifasini
        bajarmasligi bo'lardi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FrequencyCaps" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequencyCaps" }

  /v1/admin/auth/login:
    post:
      tags: [Admin]
      summary: Admin panelga kirish (email + parol + 2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                totpCode: { type: string, description: "2FA yoqilgan bo'lsa majburiy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchilar ro'yxati
      description: |
        Rollar: Owner, Admin, Support, Analyst. Javobda sog'liq ma'lumotlari yo'q —
        faqat hisob va texnik metadata (TZ 17-bo'lim).
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "email / telefon / ism" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AccountStatus" } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/Language" } }
        - { name: lifeStage, in: query, schema: { $ref: "#/components/schemas/LifeStage" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserSummary" }
                  total: { type: integer, format: int64 }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{id}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchi kartochkasi (Umumiy / Obuna / Texnik)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserCard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{id}/block:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Hisobni bloklash yoki blokdan chiqarish
      description: Sabab majburiy va audit log'ga tushadi. Bloklashda barcha sessiyalar bekor qilinadi.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked, reason]
              properties:
                blocked: { type: boolean }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/users/{id}/premium:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Qo'lda Premium berish
      description: Firibgarlikdan himoya sifatida sabab majburiy va audit yozuvi yaratiladi.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                expiresAt: { type: string, format: date-time, nullable: true }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/features:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Entitlements va limitlar jadvali
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureDefinition" }

  /v1/admin/features/{key}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Funksiya limitlarini o'zgartirish
      description: O'zgarish ilovani yangilamasdan kuchga kiradi.
      parameters: [{ $ref: "#/components/parameters/FeatureKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeatureDefinitionRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{id}/features/{key}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Foydalanuvchi uchun alohida override o'rnatish
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/FeatureKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                enabled: { type: boolean, nullable: true }
                dailyLimit: { type: integer, nullable: true }
                monthlyLimit: { type: integer, nullable: true }
                reason: { type: string, minLength: 1 }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Override'ni olib tashlash
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/FeatureKey" }
      responses:
        "200": { $ref: "#/components/responses/Ack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/flags:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Feature flags va ularning qoidalari
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminFlag" }

  /v1/admin/flags/{key}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Bayroqni yoqish/o'chirish (kill switch)
      parameters: [{ $ref: "#/components/parameters/FlagKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, defaultValue]
              properties:
                enabled: { type: boolean }
                defaultValue: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/flags/{key}/rules:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Targeting qoidasi qo'shish
      description: |
        `rolloutPercentage` foydalanuvchi id va bayroq kalitidan olingan barqaror hash
        bo'yicha bo'linadi — 5% dan 20% ga kengaytirish faqat yangi foydalanuvchi qo'shadi.
      parameters: [{ $ref: "#/components/parameters/FlagKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFlagRuleRequest" }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }

  /v1/admin/flags/{key}/rules/{ruleId}:
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Qoidani o'chirish
      parameters:
        - { $ref: "#/components/parameters/FlagKey" }
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ack" }

  /v1/admin/audit:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      summary: Audit log (faqat Owner)
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  total: { type: integer, format: int64 }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeatureKey:
      name: key
      in: path
      required: true
      schema: { type: string, example: ai_chat }
    FlagKey:
      name: key
      in: path
      required: true
      schema: { type: string, example: ai_chat_enabled }
    LogDate:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    MedicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Health:
      description: Holat
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              environment: { type: string }
              version: { type: string }
    Ack:
      description: Bajarildi
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
    AuthSession:
      description: Sessiya
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthSession" }
    UserProfile:
      description: Profil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserProfile" }
    BadRequest:
      description: So'rov noto'g'ri
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: Avtorizatsiya talab qilinadi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Forbidden:
      description: Ruxsat yo'q
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    NotFound:
      description: Topilmadi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Conflict:
      description: Ziddiyat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ConsentRequired:
      description: "Sog'liq ma'lumotlarini saqlash roziligi berilmagan"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    RateLimited:
      description: Juda ko'p so'rov
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    Language:
      type: string
      enum: [uz, ru, en]
    LifeStage:
      type: string
      enum: [cycle, trying_to_conceive, pregnancy, postpartum, perimenopause, menopause]
    Goal:
      type: string
      enum:
        [understand_cycle, sleep_better, more_energy, less_stress, eat_balanced,
         drink_water, be_active, remember_meds]
    Platform:
      type: string
      enum: [ios, android, web]
    AccountStatus:
      type: string
      enum: [active, blocked, deletion_pending]
    SubscriptionTier:
      type: string
      enum: [free, premium]
    SubscriptionSource:
      type: string
      enum: [app_store, google_play, payme, click, manual]
    AuthProvider:
      type: string
      enum: [phone, email, apple, google]

    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [validation_failed, unauthorized, forbidden, not_found, conflict,
                 rate_limited, otp_invalid, otp_expired, otp_too_many_attempts,
                 token_expired, token_revoked, social_token_invalid, account_blocked,
                 entitlement_required, consent_required, limit_reached, feature_disabled,
                 internal_error]
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
            requestId: { type: string, nullable: true }

    DeviceInfo:
      type: object
      required: [deviceId, platform]
      properties:
        deviceId: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        osVersion: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        model: { type: string, nullable: true }
        pushToken: { type: string, nullable: true }
        timezone: { type: string, nullable: true, example: Asia/Tashkent }

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+998901234567" }
        language: { $ref: "#/components/schemas/Language" }

    OtpChallenge:
      type: object
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer }
        attemptsLeft: { type: integer }
        devCode: { type: string, nullable: true, description: "Faqat dev/stage" }

    OtpVerifyRequest:
      type: object
      required: [challengeId, code, device]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, example: "123456" }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    SocialSignInRequest:
      type: object
      required: [provider, idToken, device]
      properties:
        provider: { type: string, enum: [apple, google] }
        idToken: { type: string }
        fullName: { type: string, nullable: true, description: "Apple ismni faqat bir marta beradi" }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    EmailRegisterRequest:
      type: object
      required: [email, password, name, device]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
        language: { $ref: "#/components/schemas/Language" }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    EmailSignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true }
        allDevices: { type: boolean, default: false }

    TokenPair:
      type: object
      properties:
