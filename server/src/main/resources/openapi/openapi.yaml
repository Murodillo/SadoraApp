        Har bir sana — taxmin. `confidence: none` to'liq javob: ma'lumot yetarli
        bo'lmasa tizim 28 kunni o'ylab topmaydi, buni ochiq aytadi.
      properties:
        confidence: { type: string, enum: [none, low, medium, high] }
        reason:
          type: string
          enum:
            [stage_does_not_predict, no_data, only_baseline, few_cycles, irregular, sufficient]
        nextPeriodStart: { type: string, format: date, nullable: true }
        nextPeriodEnd: { type: string, format: date, nullable: true }
        ovulationOn: { type: string, format: date, nullable: true }
        fertileFrom: { type: string, format: date, nullable: true }
        fertileUntil: { type: string, format: date, nullable: true }
        averageCycleLength: { type: integer, nullable: true }
        averagePeriodLength: { type: integer, nullable: true }
        variationDays: { type: integer, nullable: true, description: "Sikllar tarqalishi" }
        basedOnCycles: { type: integer }

    PeriodEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        startedOn: { type: string, format: date }
        endedOn: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }

    CycleStatus:
      type: object
      properties:
        cycleDay: { type: integer, nullable: true }
        phase: { $ref: "#/components/schemas/CyclePhase" }
        phaseIsPredicted: { type: boolean }
        currentPeriod: { $ref: "#/components/schemas/PeriodEntry" }
        lastPeriodStart: { type: string, format: date, nullable: true }
        daysUntilNextPeriod: { type: integer, nullable: true }
        prediction: { $ref: "#/components/schemas/CyclePrediction" }
        today: { type: string, format: date }

