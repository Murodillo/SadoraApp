name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push makes the running check irrelevant, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The migrations are the part unit tests cannot check, so the job runs against a
    # real Postgres and boots the server against it below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sadora
          POSTGRES_USER: sadora
          POSTGRES_PASSWORD: sadora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sadora -d sadora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Zulu is Azul, which is what gradle-daemon-jvm.properties asks for.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the contract and the server
        run: ./gradlew :contract:jvmTest :server:test --stacktrace

      # Flyway either applies cleanly onto an empty database or it does not, and a unit
      # test cannot tell you which. Booting once is the only thing that can.
      - name: Boot against a real database
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sadora
          DB_USER: sadora
          DB_PASSWORD: sadora
        run: |
          ./gradlew :server:installDist
          ./server/build/install/server/bin/server &
          SERVER_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then
              echo "ready after ${attempt}s"
              curl -fsS http://localhost:8080/health/ready
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "server never became ready"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  android:
    name: Android and shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared module
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Assemble the app
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  ios:
    name: iOS shared
    # macOS minutes bill at ten times the Linux rate, so the Kotlin/Native side is
    # checked where it matters — on the way into main — rather than on every branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared module on the simulator target
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A vulnerable dependency is worth failing on rather than discovering later.
      - name: Audit
        run: npm audit --audit-level=high
