<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sadora</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=4">
<!-- The Telegram Mini App bridge: initData, theme, haptics, the back button. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="splash"><img src="../favicon.svg" alt="" width="72" height="72"><div class="spinner"></div></div>
</main>
<nav id="tabs" class="tabs" hidden>
  <button data-tab="today"><img src="../img/ic_home.webp" alt=""><span data-t="tabToday"></span></button>
  <button data-tab="calendar"><img src="../img/ic_calendar.webp" alt=""><span data-t="tabCalendar"></span></button>
  <button data-tab="meds"><img src="../img/ic_meds.webp" alt=""><span data-t="tabMeds"></span></button>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=4" type="module"></script>
</body>
</html>
