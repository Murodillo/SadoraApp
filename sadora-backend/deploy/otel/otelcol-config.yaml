# The collector inside grafana/otel-lgtm (0.35.0), as the image ships it plus one thing:
# a redaction step every trace and log passes before it is stored. Mounted over
# /otel-lgtm/otelcol-config.yaml by docker-compose.stage.yml.
#
# The API already masks what it knows about (Monitoring.kt); this is the second line, for
# what the agent records on its own:
#   - a doctor-share link's token in a path (`/share/<token>` opens her health data);
#   - query strings, where OAuth codes and the odd provider's access_token travel —
#     outgoing calls included (Oura's revoke takes the token as a parameter);
#   - the last octet of the caller's IP address.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  # Keep a trace only if it served a request, or failed. Without this every scheduler
  # poll and every Docker health probe is a trace of its own — thousands a day, burying
  # the ones somebody will look for.
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: requests
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - kind == SPAN_KIND_SERVER and not IsMatch(attributes["url.path"], "^/health")
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.path"], "/share/[^/?]+", "/share/***")
          - replace_pattern(attributes["url.full"], "/share/[^/?]+", "/share/***")
          - replace_pattern(attributes["url.full"], "\\?.*$", "?***")
          - delete_key(attributes, "url.query")
          - replace_pattern(attributes["client.address"], "\\.[0-9]+$", ".0")
          - replace_pattern(attributes["network.peer.address"], "\\.[0-9]+$", ".0")
          - replace_pattern(name, "/share/[^/?{]+", "/share/***")
          # Ktor names routes after its selectors — "/v1/(authenticate user-jwt)/me";
          # the parenthesised parts are plugins, not path, and only split the same route.
          - replace_pattern(name, "\\([^)]*\\)/", "")
          - replace_pattern(attributes["http.route"], "\\([^)]*\\)/", "")
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "/share/[^/?\\s]+", "/share/***")

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact, tail_sampling, batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
