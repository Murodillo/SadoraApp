# The landing page, and the APKs beside it.
#
# Unknown paths get 404.html, which is also the invite page: it reads a code out of
# /r/<CODE>, the same way it does on GitHub Pages, so an invite link works here too.

server {
    listen 80;
    server_name _;
    root /srv/landing;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # The gateway in front listens on another port and scheme than this container does;
    # a redirect that adds a slash (/video → /video/) must not name this one's.
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # /download/latest.json says which build is current; download.html and the landing
    # page read it and show a button only when it exists — which on GitHub Pages it never
    # does. The manifest and the stable aliases must not cache at all; versioned APK names
    # never change content, so they cache forever.
    location /download/ {
        root /srv;
        add_header X-Content-Type-Options nosniff always;

        location ~ \.json$ {
            add_header Cache-Control "no-store" always;
        }
        location ~ "^/download/sadora-[a-z-]+-[0-9]+-[0-9a-f]{7,40}\.apk$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            types { application/vnd.android.package-archive apk; }
            add_header Content-Disposition attachment always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ \.apk$ {
            add_header Cache-Control "no-store" always;
            types { application/vnd.android.package-archive apk; }
            add_header Content-Disposition attachment always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # The promo video behind /video/. The API writes the file and current.json into a
    # directory this container sees read-only (MEDIA_DIR, docker-compose.prod.yml), when
    # staff upload one in the admin panel. The manifest must not cache at all; a video's
    # name carries its upload time, so it caches forever. Nothing else in the directory
    # is served — an upload still arriving sits there as a .part file.
    location /video/media/ {
        root /srv/promo;
        add_header X-Content-Type-Options nosniff always;

        location = /video/media/current.json {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ "^/video/media/sadora-[0-9]+\.(mp4|webm)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ . {
            return 404;
        }
    }
}
