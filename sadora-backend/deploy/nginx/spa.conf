# A single-page app — the staff panel or the doctors' panel, whichever is mounted at
# /srv/app. Files only: the panel calls the API on its own hostname (VITE_API_BASE).

server {
    listen 80;
    server_name _;
    root /srv/app;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Vite names every asset by its content, so an asset never changes under its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # /rewards or /users/… are routes in the browser, not files, so anything that is not
    # a file falls back to index.html — which must never be cached, or a deploy would
    # leave browsers asking for assets that are gone.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
