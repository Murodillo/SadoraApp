# The whole backend on one server: Postgres, Redis, the API, and the three static sites
# in front of it. Run from sadora-backend:
#
#   docker compose -f docker-compose.prod.yml --env-file server/.env.prod up -d --build
#
# Deliberately different from docker-compose.yml, which only provides what a laptop's
# Gradle run talks to. Here the API is a container as well, so a server needs nothing
# installed but Docker — no JDK, no Gradle, no source tree.
#
# There is no reverse proxy in this stack. The gateway in front of the server terminates
# TLS for every sadora.app hostname and forwards each one to a port of its own:
#
#   doctor.sadora.app  → 8090  doctor-admin  the doctors' panel (static files)
#   sadora.app         → 8091  landing       the landing page and the APK downloads
#   admin.sadora.app   → 8092  admin         the staff panel (static files)
#   api.sadora.app     → 8093  api           the API itself
#
# Staging runs the same file with docker-compose.stage.yml on top, which moves these to
# 8080–8083 for the dev- hostnames. The panels call the API on its own hostname, so they
# are built with VITE_API_BASE and the API's CORS list names their origins.
#
# Postgres and Redis publish no ports. They are reachable only from the API container
# over the compose network, which is the whole point: a database on a public IP with a
# password is a database somebody will eventually guess the password of.

name: sadora

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sadora}
      POSTGRES_USER: ${POSTGRES_USER:-sadora}
      # No default. Compose refuses to start without it rather than quietly booting a
      # production database with a password from an example file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - sadora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sadora} -d ${POSTGRES_DB:-sadora}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: everything in here is a cache or a counter, and losing it costs a
    # few extra queries. `Caches.create` falls back to an in-memory cache if Redis is
    # missing entirely, so this service is a performance choice, not a dependency.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    # CI builds the image once, pushes it to GHCR, and the server runs exactly that image
    # by digest (`SADORA_API_IMAGE=ghcr.io/…@sha256:…`). Without the variable, `--build`
    # produces sadora-api:local from this checkout, as a manual deploy always has.
    image: ${SADORA_API_IMAGE:-sadora-api:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # The environment file carries the secrets; these two only point the app at the
    # containers beside it, and they are not secrets, so they stay readable here.
    env_file:
      # Overridable so a staging box runs this same file with its own secrets —
      # `SADORA_ENV_FILE=server/.env.stage` — instead of a second copy of the stack.
      - ${SADORA_ENV_FILE:-server/.env.prod}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sadora}
      DB_USER: ${POSTGRES_USER:-sadora}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Published on the server's own interfaces for the gateway; the server has no public
    # address, so only the gateway and the LAN reach it, and the server checks itself on
    # loopback.
    ports:
      - "8093:8080"
    # Credential files the env file points at — today the Firebase service account for
    # push. Read-only, and a directory rather than one file, so a server without the key
    # still starts: FCM_SERVICE_ACCOUNT_FILE stays blank there and push goes to the log.
    volumes:
      - ${SADORA_SECRETS_DIR:-./server/secrets}:/run/secrets/sadora:ro

  # The static sites. nginx serves files and nothing else — it proxies nothing; each
  # directory is put in place by a deploy, and the container is restarted to see it.
  landing:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/landing.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing:/srv/landing:ro
      # APKs published by CI (`sadora-ci publish-apk`). Outside the source tree, so a
      # deploy that replaces the landing page never takes the download with it.
      - ./downloads:/srv/download:ro
    ports:
      - "8091:80"

  admin:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin/dist:/srv/app:ro
    ports:
      - "8092:80"

  doctor-admin:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro
      # The doctors' panel, built from sadora-doctor-admin and shipped beside the admin.
      - ./doctor-admin/dist:/srv/app:ro
    ports:
      - "8090:80"

volumes:
  sadora-pgdata:
